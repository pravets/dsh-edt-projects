name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Проверка бандла (манифест, патч, локали, иконка)
        run: npm run validate

      - name: Тесты правил для модели
        run: npm test

      - name: Состав tarball
        run: npm run pack:check

      - name: Синтаксис скриптов
        run: |
          node --check tools/validate-bundle.mjs
          node --check tools/check-edt-mcp.mjs
          node --check tools/edt-workspace.mjs
          node --check packages/dsh-edt-projects/lib/repo.mjs
          node --check packages/dsh-edt-projects/lib/workspace.mjs
          node --check packages/dsh-edt-projects/lib/workspace-run.mjs

