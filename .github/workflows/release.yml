name: Release

# Тег v0.9.0 -> проверка, что версия в packages/dsh-edt-projects/package.json совпадает,
# сборка tarball, GitHub Release и публикация в npm через trusted publisher
# (OIDC): секретов и токенов нет, npm выдаёт короткоживущий токен по id-token.
# Установка потом: plugin_manager install_bundle с URL этого .tgz.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v0.9.0'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Node 22 приносит npm 10.x, а trusted publishing требует npm >= 11.5.
      - name: npm для trusted publishing
        run: npm install -g "npm@^11.15.0"

      - name: Зависимости
        run: npm ci

      - name: Сверка тега с версией бандла
        run: npm run validate:tag -- "$RELEASE_TAG"

      - name: Сборка tarball
        run: |
          mkdir -p dist
          npm pack --workspace dsh-edt-projects --pack-destination dist --cache .npm-cache

      - name: Публикация релиза
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.tgz
          generate_release_notes: true

      # Публикует trusted publisher, настроенный на npm для этого репозитория и
      # файла release.yml: токен выдаёт сам npm по OIDC (permissions.id-token).
      # Уже опубликованную версию шаг пропускает, чтобы ручной релиз и push тега
      # не конфликтовали.
      - name: Диагностика OIDC
        run: |
          echo "id-token url:   ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "id-token token: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
          echo "npm: $(npm --version)"

      - name: Публикация в npm
        env:
          # verbose показывает причину, по которой OIDC не сработал:
          # "oidc Skipped because ..." или "Failed token exchange request with body message: ..."
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          version=$(node -p "require('./packages/dsh-edt-projects/package.json').version")
          if npm view "dsh-edt-projects@$version" version >/dev/null 2>&1; then
            echo "версия $version уже в npm — пропускаю"
          else
            npm publish --workspace dsh-edt-projects --access public --provenance
          fi

