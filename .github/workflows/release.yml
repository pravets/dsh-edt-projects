name: Release

# Тег v0.9.0 -> проверка, что версия в edt-mcp/package.json совпадает,
# сборка tarball и прикрепление его к GitHub Release.
# Установка потом: plugin_manager install_bundle с URL этого .tgz.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v0.9.0'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Сверка тега с версией бандла
        run: npm run validate:tag -- "$RELEASE_TAG"

      - name: Сборка tarball
        run: |
          mkdir -p dist
          npm pack --workspace edt-mcp --pack-destination dist --cache .npm-cache

      - name: Публикация релиза
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.tgz
          generate_release_notes: true

      # Первая публикация в npm делается вручную (npm login + npm publish),
      # дальше версии из тегов уходят сюда. Уже опубликованную версию шаг
      # пропускает, чтобы ручной релиз и push тега не конфликтовали.
      - name: Публикация в npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./edt-mcp/package.json').version")
          if npm view "dsh-edt-projects@$version" version >/dev/null 2>&1; then
            echo "версия $version уже в npm — пропускаю"
          elif [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN не задан — публикация пропущена"
          else
            npm publish --workspace edt-mcp --access public --provenance
          fi

