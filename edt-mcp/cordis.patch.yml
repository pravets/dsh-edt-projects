# Хаб MCP-серверов для разработки на 1С.
#
# Серверы описываются здесь и подключаются плагином mcp-hub (lib/index.js):
#   - `lazy: true`      — не занимать контекст: сервер монтируется по вызову mcp_pin
#   - `provision: true` — параметры запуска добираются на mcp_pin (BSL LS скачивается)
#   - `shared: true`    — одна копия на процесс; остальные серверы монтируются
#                         в скоуп агента (параллельные worktree не мешают друг другу)
#   - `unavailable`     — сервер описан, но настроить его нечем (mcp_pin объяснит, чем)
#
# Настройки можно переопределить без перезапуска DSH — файлами
# $DSH_HOME/dsh-1c.json (пользователь) и <cwd>/.dsh-1c.json (проект):
#   { "wiki": { "paths": ["C:\\git\\dev-llm-wiki"], "entry": "wiki/index.md" },
#     "servers": { "edt": { "url": "http://127.0.0.1:8767/mcp" },
#                  "bsl": { "root": "C:\\git\\trade\\src\\cf" } } }
# После правки файла: mcp_reload (или mcp_pin заново).
#
# Переменные окружения (префикс DSH_1C_ — чтобы ни с чем не пересекаться):
#   EDT_MCP_URL               адрес MCP-сервера EDT (по умолчанию 127.0.0.1:8767)
#   EDT_MCP_TOKEN             токен, если он включён в EDT
#   DSH_1C_WIKI               пути к вики через «;»
#   DSH_1C_WIKI_ENTRY         входная точка вики, например wiki/index.md
#   DSH_1C_BSL_LS_JAR         готовый bsl-language-server jar (главнее всего)
#   DSH_1C_BSL_LS_URL         прямой URL на jar вместо GitHub
#   DSH_1C_BSL_LS_VERSION     тег релиза, например v1.0.7 (по умолчанию последний)
#   DSH_1C_BSL_LS_CACHE       каталог кэша ($DSH_HOME/cache/bsl-language-server)
#   DSH_1C_BSL_LS_DOWNLOAD    «0» — не скачивать, использовать только готовый jar
#   DSH_1C_BSL_LS_JAVA        java-команда (по умолчанию java)
#   DSH_1C_BSL_LS_ROOT        корень исходников для BSL LS
#   DSH_1C_BSL_MCP_URL        адрес уже запущенного BSL LS по Streamable HTTP
#   TASKS_MCP_URL             адрес MCP-сервера системы задач
#   TASKS_MCP_TOKEN           токен системы задач
- insert:
    - id: mcp-hub
      name: '@local/dsh-edt-mcp'
      config:
        wiki:
          paths: !!js 'process.env.DSH_1C_WIKI ? process.env.DSH_1C_WIKI.split(";").filter(Boolean) : []'
          entry: !!js 'process.env.DSH_1C_WIKI_ENTRY ?? ""'
        servers:
          # EDT один на процесс: одна копия, чтобы агенты не поднимали лишние сессии.
          edt:
            shared: true
            lazy: false
            transport: streamable-http
            url: !!js 'process.env.EDT_MCP_URL ?? "http://127.0.0.1:8767/mcp"'
            headers: !!js 'process.env.EDT_MCP_TOKEN ? { Authorization: `Bearer ${process.env.EDT_MCP_TOKEN}` } : {}'
            # Операции EDT (update_database, run_yaxunit_tests, валидация) идут дольше 60 с.
            toolCallTimeoutMs: 900000
            # EDT часто закрыт: не валить активацию, ждать сервер.
            failOnStartupError: false
            reconnect:
              enabled: true
              initialDelayMs: 1000
              maxDelayMs: 30000
              maxAttempts: 1000

          # BSL Language Server: 10 инструментов, нужны эпизодически.
          # provision: на mcp_pin берётся готовый jar из DSH_1C_BSL_LS_JAR, иначе из
          # кэша, иначе скачивается последний релиз с GitHub (sha256 сверяется).
          # Корень по умолчанию — servers.bsl.root из файла настроек проекта.
          bsl:
            lazy: true
            provision: true
            toolCallTimeoutMs: 120000
            failOnStartupError: false

          # Система задач: место зарезервировано под любой MCP-сервер.
          # Конкретный продукт (YouTrack, Jira, GitLab, GitHub) — это его адрес и токен.
          tasks:
            lazy: true
            unavailable: !!js '!process.env.TASKS_MCP_URL'
            transport: streamable-http
            url: !!js 'process.env.TASKS_MCP_URL ?? "http://127.0.0.1:8090/mcp"'
            headers: !!js 'process.env.TASKS_MCP_TOKEN ? { Authorization: `Bearer ${process.env.TASKS_MCP_TOKEN}` } : {}'
            toolCallTimeoutMs: 120000
            failOnStartupError: false
